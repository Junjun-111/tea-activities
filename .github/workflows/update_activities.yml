name: update-activities

on:
  schedule:
    - cron: '0 16 * * *'   # 北京 0:00
    - cron: '0 22 * * *'   # 北京 6:00
    - cron: '0 4 * * *'    # 北京 12:00
    - cron: '0 10 * * *'   # 北京 18:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pillow

      - name: Run update script
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: python scripts/update_activities.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "update activities $(date +'%Y-%m-%d %H:%M')"; git push; fi
