name: update-activities

on:
  schedule:
    # 联网搜索按次计费，是主要开销；改成每天 2 次（原来 4 次）。
    # 想更勤就把注释的两条放开，想更省就只留一条。
    - cron: '0 16 * * *'   # 北京 0:00
    - cron: '0 4 * * *'    # 北京 12:00
    # - cron: '0 22 * * *' # 北京 6:00
    # - cron: '0 10 * * *' # 北京 18:00
  # 手动运行：出门到别的城市时，在 Actions 页面点 Run workflow，
  # 在 cities 里填城市 key（如 beijing 或 shenyang,beijing）即可，
  # 不用改文件。留空 = 用下面的默认城市。
  workflow_dispatch:
    inputs:
      cities:
        description: '要更新的城市 key（逗号分隔，如 beijing）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 活动数据只保留文字，脚本不再下载/生成海报图，所以不需要 pillow
      - run: pip install requests oss2

      # 只生成当前需要的城市：逐个城市要联网搜索，跑满 12 个城市是 12 倍的模型费用，
      # 而用户同一时间只在一个城市。默认只跑 shenyang，出远门时用上面的手动触发换城市。
      - name: Run update script
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          CITY_KEYS: ${{ github.event.inputs.cities || 'shenyang' }}
          # 免费模式：不调用付费模型/联网搜索（改抓公开网页 + 关键词规则）。
          # 方舟余额充好了想切回模型模式（更准），把下面这行删掉或改成 '0'。
          FREE_MODE: '1'
          # 省 token 的模型提取：填好这三个 secret 就自动生效（模型只做提取、
          # 联网搜索仍由脚本自己做，所以一次只要几千 token）。
          # 例：LLM_BASE_URL=https://api.deepseek.com/v1  LLM_MODEL=deepseek-chat
          #     LLM_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1  LLM_MODEL=qwen-flash
          #     LLM_BASE_URL=https://open.bigmodel.cn/api/paas/v4  LLM_MODEL=glm-4.5-flash
          #     LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai  LLM_MODEL=gemini-2.0-flash
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/update_activities.py

      # 同步到 OSS（App 的首选数据源）。失败不阻塞后面的提交，
      # 否则 OSS 出问题会连带数据也推不上去（之前 OSS 就停更在 9/11）
      - name: Upload to Aliyun OSS
        continue-on-error: true
        env:
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
        # 注意：两个参数分别是「数据目录」和「图片目录」。
        # 之前传的是仓库根目录 "."，脚本扫不到任何 json，这一步等于空跑，
        # 导致 App 首选的 OSS 数据一直停在旧日期（只能靠 jsDelivr 兜底）。
        run: python scripts/upload_oss.py data images

      - name: Commit and push (mirror backup)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "update activities $(date +'%Y-%m-%d %H:%M')"; git push; fi

      # 清一下 jsDelivr 的缓存：App 会把 OSS 和 jsDelivr 镜像都拉一遍挑更新的那份，
      # 镜像缓存没刷新时会拿着旧数据参与比较（旧数据条数更多时曾经把新数据盖掉）
      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          for f in activities.json activities_shenyang.json; do
            curl -s -m 20 "https://purge.jsdelivr.net/gh/Junjun-111/tea-activities@main/data/$f" > /dev/null && echo "purged $f"
          done
